name: numbarrow_ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        arch: [ "ubuntu-latest", "ubuntu-24.04-arm", "windows-latest" ]
    runs-on: "${{ matrix.arch }}"

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Determine version
      shell: bash
      id: version
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          BUILD_VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
        fi
    - name: Write version to __init__.py
      shell: bash
      run: echo "__version__ = '${{ env.VERSION }}'" > numbarrow/__init__.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest setuptools
        pip install pandas==2.3.2
        pip install pyspark==3.5.7
        pip install -e .
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
    - name: Install build dependencies
      run: |
        pip install build==1.2.2.post1 wheel==0.45.0
    - name: Build wheel
      run: |
        git clean -Xfd
        python -m build --wheel

  build-pyarrow-range:
    # The ends of the pyarrow range the dependency cap admits, as a separate
    # job so that pinning them does not multiply the matrix above. The real
    # constraint is numpy, not pyarrow: 14.0.0 passes, but pyarrow below 16 is
    # built against numpy 1 and dies with "numpy.core.multiarray failed to
    # import" if numpy 2 is present, so the floor cell pins numpy too.
    # Neither pandas nor pyspark is
    # installed here, so this is also the stock-install shape: the adapters
    # must resolve a dtype without importing pandas, and the spark tests
    # skip themselves.
    strategy:
      # Both ends report independently: a failure at the floor should not cancel
      # the ceiling cell, since the point of the job is the comparison.
      fail-fast: false
      matrix:
        include:
          - pyarrow-version: "14.0.0"
            numpy-pin: "numpy<2"
          - pyarrow-version: "24.0.0"
            numpy-pin: ""
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Write version to __init__.py
      shell: bash
      run: echo "__version__ = '0.1.${{ github.run_number }}'" > numbarrow/__init__.py
    - name: Install dependencies
      # The matrix values reach the shell as environment variables rather than
      # being pasted into the script text. The numpy pin contains a `<`, which
      # the shell reads as a redirection when it is substituted unquoted: the
      # step died with "line 5: 2: No such file or directory" while looking for
      # a file called 2. The :+ form expands to nothing at all when the pin is
      # empty, rather than passing pip an empty argument.
      env:
        PYARROW_VERSION: ${{ matrix.pyarrow-version }}
        NUMPY_PIN: ${{ matrix.numpy-pin }}
      run: |
        python -m pip install --upgrade pip
        # python-dateutil is imported by the test suite; without it pytest
        # aborts collection and the job goes red having run nothing.
        pip install flake8 pytest setuptools python-dateutil
        pip install "pyarrow==${PYARROW_VERSION}" ${NUMPY_PIN:+"${NUMPY_PIN}"}
        pip install --ignore-requires-python -e .
        pip check
    - name: Test with pytest
      run: |
        pytest --durations=20
