[build-system]
requires = ["setuptools~=75.3.0", "wheel~=0.45.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["numbarrow*"]

[project]
name = "numbarrow"
dependencies = [
    "numba>=0.60.0,<0.68.0",
    # No floor is declared, and CI tests both 14.0.0 and 25.0.1. pyarrow 14
    # fails to import next to numpy 2 but does not exclude it, so CI installs
    # it with numpy<2. pyarrow 15 excludes numpy 2 itself.
    "pyarrow<=25.0.1"
]
dynamic = ["version"]
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = ["pyarrow", "pyspark", "numba", "numpy"]
authors = [
  {name = "NumbArrow GitHub Repository Contributors"}
]
readme = "README.md"

[project.optional-dependencies]
test = [
    # 2.2.2 is the first pandas built against numpy 2; 2.1.1 installs next to
    # it and fails to import.
    "pandas>=2.2.2",
    # pyspark 3.3 bundles cloudpickle 2.0.0, which predates the co_qualname
    # argument that Python 3.11 added to code(). On the declared Python, no UDF
    # runs: the driver cannot pickle the function that make_mapinarrow_func
    # returns, and a worker cannot unpickle even a trivial one. 3.4.0 is the
    # first release that runs a UDF, and 3.5.0 the first that imports on 3.13.
    "pyspark>=3.4.0,<4.0.0; python_version < '3.13'",
    "pyspark>=3.5.0,<4.0.0; python_version >= '3.13'",
    "pytest",
    "python-dateutil>=2.8.0",
    "setuptools>=75.0.0"
]
mapinarrow = [
    "pandas>=2.2.2",
    # pyspark's mapInArrow imports distutils, which PEP 632 removed from the
    # standard library in Python 3.12, the floor this package declares.
    # setuptools still provides it; without setuptools, mapInArrow raises
    # ModuleNotFoundError. The test extra lists setuptools as well, so only
    # .github/scripts/extras_sufficiency_check.py, which installs each extra
    # alone, can catch its absence from this one.
    "setuptools>=75.0.0",
]
docs = [
    "sphinx==8.1.3", "sphinx-sitemap==2.7.2", "sphinx_rtd_theme"
]

[tool.setuptools.dynamic]
version = {attr = "numbarrow.__version__"}
