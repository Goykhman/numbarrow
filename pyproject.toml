[build-system]
requires = ["setuptools~=75.3.0", "wheel~=0.45.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["numbarrow*"]

[project]
name = "numbarrow"
dependencies = [
    "numba>=0.60.0,<0.68.0",
    "pyarrow<=24.0.0"
]
dynamic = ["version"]
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = ["pyarrow", "pyspark", "numba", "numpy"]
authors = [
  {name = "NumbArrow GitHub Repository Contributors"}
]
readme = "README.md"

[project.optional-dependencies]
test = [
    "pandas>=1.5.0",
    # pyspark 3.3 bundles cloudpickle 2.0.0, which predates the co_qualname
    # argument Python 3.11 added to code(), so on the declared Python every
    # UDF dies in the worker. 3.4.0 is the first release that runs one.
    "pyspark>=3.4.0,<4.0.0",
    "pytest",
    "python-dateutil>=2.8.0",
    "setuptools>=75.0.0"
]
mapinarrow = [
    "pandas>=1.5.0",
    # pyspark's mapInArrow path imports distutils, which PEP 632 removed from
    # the standard library in 3.12, the floor this package declares. setuptools
    # is the only supplier, and without it mapInArrow dies on
    # ModuleNotFoundError. The test extra already pins it, which is why CI
    # never saw this.
    "setuptools>=75.0.0",
]
docs = [
    "sphinx==8.1.3", "sphinx-sitemap==2.7.2", "sphinx_rtd_theme"
]

[tool.setuptools.dynamic]
version = {attr = "numbarrow.__version__"}
